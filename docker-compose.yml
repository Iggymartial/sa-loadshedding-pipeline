services:
  mysql:
    image: mysql:8.0
    container_name: loadshedding_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpassword}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-loadshedding}
      MYSQL_USER: ${MYSQL_USER:-pipeline_user}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-pipeline_password}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # Anything in docker-entrypoint-initdb.d runs automatically the
      # FIRST time the container starts with an empty data directory.
      # This is what applies schema.sql without any manual step.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10

  # ---------------------------------------------------------------------
  # Pipeline stages below. Each is a ONE-SHOT task, not a long-running
  # server like mysql - it runs its script to completion and exits. Run
  # them explicitly with `docker compose run --rm <name>`, not
  # `docker compose up`, which is meant for persistent services.
  #
  # All three share the SAME built image (same Dockerfile, same
  # dependencies) - only the `command:` differs. This also mirrors
  # exactly how Airflow will call these same scripts as separate tasks
  # in the next step: one script, one discrete unit of work.
  # ---------------------------------------------------------------------

  extractor:
    build: .
    image: sa-loadshedding-pipeline:latest
    container_name: loadshedding_extractor
    env_file:
      - .env
    volumes:
      # Mounting ./data means files written inside the container land
      # in your real project folder too - the same data/raw/ you've
      # been inspecting locally all along, not something trapped
      # inside a container's private filesystem.
      - ./data:/app/data
    command: ["python", "extractor/extract.py"]

  transform:
    image: sa-loadshedding-pipeline:latest
    container_name: loadshedding_transform
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    command: ["python", "transform/transform.py"]

  loader:
    image: sa-loadshedding-pipeline:latest
    container_name: loadshedding_loader
    env_file:
      - .env
    environment:
      # Overrides whatever MYSQL_HOST is set to in .env (127.0.0.1,
      # correct for running load.py directly on your machine). Inside
      # this Docker network, "mysql" is the correct hostname - Docker
      # Compose gives every service a DNS name matching its service
      # name, resolvable only from other containers on the same network.
      MYSQL_HOST: mysql
    volumes:
      - ./data:/app/data
    depends_on:
      mysql:
        condition: service_healthy

    command: ["python", "loader/load.py"]

  # ---------------------------------------------------------------------
  # Airflow, running in STANDALONE mode: one container, SQLite metadata
  # store, scheduler + webserver + triggerer all in one process. This is
  # officially supported for local development/learning (not
  # production) - the full multi-service Celery quick-start (Postgres +
  # Redis + separate workers) would be considerable overkill for a
  # single scheduled DAG on a solo project.
  # ---------------------------------------------------------------------
  airflow:
    build:
      context: .
      dockerfile: Dockerfile.airflow
    image: sa-loadshedding-airflow:latest
    container_name: loadshedding_airflow
    env_file:
      - .env
    environment:
      MYSQL_HOST: mysql
      AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    ports:
      # 8081, not 8080 - the Java API already uses 8080 on the host.
      - "8081:8080"
    volumes:
      - ./airflow_dags:/opt/airflow/dags
      # Pipeline data - same host folder every other stage already
      # reads/writes, so runs triggered by Airflow show up in the exact
      # same data/raw and data/processed you've been inspecting all along.
      - ./data:/opt/airflow/pipeline/data
      # Airflow's own state (SQLite db, logs, config) persists across
      # container restarts via a named volume, separate from our
      # pipeline's data.
      - airflow_home:/opt/airflow
    depends_on:
      mysql:
        condition: service_healthy
    command: standalone

volumes:
  mysql_data:
  airflow_home:
