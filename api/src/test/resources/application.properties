# This file overrides application.properties ONLY when running tests
# (Maven puts src/test/resources ahead of src/main/resources on the
# test classpath). Tests run against an in-memory H2 database, never
# against real MySQL - fast, free, and doesn't need docker compose up.
spring.datasource.url=jdbc:h2:mem:testdb;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Unlike the real app (ddl-auto=none, schema owned by db/schema.sql),
# tests let Hibernate generate the schema straight from the entity
# annotations. There's no equivalent "source of truth" schema file for
# a throwaway in-memory test database - the entities ARE the source of
# truth here, since that's what's actually being tested.
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
