spring.application.name=sa-loadshedding-api

# Matches docker-compose.yml's defaults exactly. Override via standard
# Spring Boot environment variables (SPRING_DATASOURCE_URL,
# SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD) if your local
# setup differs - no code change needed, same philosophy as the
# ESP_API_BASE_URL environment variable in the Python pipeline.
spring.datasource.url=jdbc:mysql://localhost:3306/loadshedding
spring.datasource.username=pipeline_user
spring.datasource.password=pipeline_password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# CRITICAL: this schema is owned by db/schema.sql (the Python data
# engineering pipeline), not by this application. Hibernate must never
# create, alter, or drop tables here - "none" means it only maps to
# what already exists and never touches the schema itself.
spring.jpa.hibernate.ddl-auto=none

# Standard good practice for a REST API: don't keep a database session
# open for the lifetime of rendering a response. Not rendering any
# server-side views here (pure JSON), so there's no reason for it to
# be on.
spring.jpa.open-in-view=false

server.port=8080
